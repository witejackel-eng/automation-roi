name: CI

on:
  push:
    branches: [main, zai/**]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viableo
          POSTGRES_PASSWORD: viableo
          POSTGRES_DB: viableo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viableo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://viableo:viableo@localhost:5432/viableo_test
      TEST_DATABASE_URL: postgresql://viableo:viableo@localhost:5432/viableo_test
      NEXTAUTH_SECRET: ci-testing-secret-do-not-use-in-prod
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run Prisma migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit + integration tests
        run: bun run test

      - name: Golden-case verification
        run: bun run verify:golden

      - name: Cross-tenant isolation tests
        run: bun run test src/lib/tenant/__tests__/cross-tenant-isolation.test.ts

      - name: Output consistency tests
        run: bun run test src/lib/calculations/__tests__/output-consistency.test.ts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: bunx playwright test

      - name: Production build
        run: bun run build

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
