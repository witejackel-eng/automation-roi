name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL: ${{ secrets.DIRECT_URL_TEST }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_TEST }}
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ${{ secrets.GITHUB_ID_TEST }}
      GITHUB_SECRET: ${{ secrets.GITHUB_SECRET_TEST }}
      WHOP_API_KEY: ${{ secrets.WHOP_API_KEY_TEST }}
      WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID_TEST }}
      WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET_TEST }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Apply test database migrations
        run: bunx prisma migrate deploy
      - name: Run full certification gate (typecheck, lint, unit tests, tenant isolation, output consistency, golden case, build, E2E)
        run: bun run certify
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-gate:
    needs: certify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed — Vercel will now deploy via its own GitHub integration
        run: echo "certify job passed on main; Vercel's native GitHub integration handles the actual deployment and will only promote this commit because CI succeeded (see Human Runbook step for enabling 'Wait for CI to pass before deploying' in Vercel project settings)."
